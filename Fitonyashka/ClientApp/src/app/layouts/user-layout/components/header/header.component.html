<header class="app-header">
  <div class="header-container">
    <div class="logo">
      <span>Fitonyashka</span>
    </div>

    <nav class="menu" [class.open]="menuOpen">
      <ul class="menu-list">
        <li>
          <a (click)="navigate('/dashboard')" class="menu-link">Dashboard</a>
        </li>
        <li>
          <a (click)="navigate('/profile')" class="menu-link">Profile</a>
        </li>
        <li>
          <a (click)="navigate('/settings')" class="menu-link">Settings</a>
        </li>
        <li>
          <a (click)="logout()" class="menu-link logout">Logout</a>
        </li>
      </ul>
    </nav>

    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

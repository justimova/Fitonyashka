<div class="settings-container">
  <div class="settings-card">
    <h1>Settings</h1>

    <div class="settings-section">
      <h2>Notifications</h2>
      <div class="setting-item">
        <div class="setting-info">
          <label>Enable Notifications</label>
          <p class="description">Receive notifications about important updates</p>
        </div>
        <input type="checkbox" [(ngModel)]="settings.notifications" />
      </div>
      <div class="setting-item">
        <div class="setting-info">
          <label>Email Updates</label>
          <p class="description">Receive email notifications</p>
        </div>
        <input type="checkbox" [(ngModel)]="settings.emailUpdates" />
      </div>
    </div>

    <div class="settings-section">
      <h2>Appearance</h2>
      <div class="setting-item">
        <div class="setting-info">
          <label>Dark Mode</label>
          <p class="description">Use dark theme</p>
        </div>
        <input type="checkbox" [(ngModel)]="settings.darkMode" />
      </div>
      <div class="setting-item">
        <div class="setting-info">
          <label>Language</label>
        </div>
        <select [(ngModel)]="settings.language" class="select-input">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </div>
    </div>

    <div class="settings-section">
      <h2>Privacy</h2>
      <div class="setting-item">
        <div class="setting-info">
          <label>Profile Visibility</label>
          <p class="description">Who can see your profile</p>
        </div>
        <select [(ngModel)]="settings.privacy" class="select-input">
          <option value="public">Public</option>
          <option value="friends">Friends Only</option>
          <option value="private">Private</option>
        </select>
      </div>
    </div>

    <div class="settings-actions">
      <button class="btn-save" (click)="onSave()">Save Settings</button>
      <button class="btn-reset">Reset to Default</button>
    </div>
  </div>
</div>
